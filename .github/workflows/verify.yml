name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  product-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm run lint
      - run: npm run coverage
      - run: npm test
      - run: npm run check:seam
      - run: npm run check:d1
