name: Bug report
description: Report a reproducible product or engineering defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include learner data, credentials, private service URLs, or security vulnerabilities. Use private vulnerability reporting for security issues.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest synthetic example and exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or branch name
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Browser side panel
        - Full Virgil page
        - Background pipeline
        - Deployment
        - Other
    validations:
      required: true
